<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guilda da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700;800;900&family=Grenze+Gotisch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Salão da guilda à noite: ardósia azulada, pergaminho e ouro de taverna */
  --bg: #10161b;
  --bg-2: #161e24;
  --panel: #1c252c;
  --panel-2: #243039;
  --line: #33424d;
  --ink: #f1e8d4;
  --muted: #9eaab0;
  --gold: #eab54c;
  --gold-2: #ffd98a;
  --good: #7fd37a;
  --bad: #ee6b5f;
  --d-mf: #7fd3c4;
  --d-f: #8fd36a;
  --d-m: #f0b84a;
  --d-d: #ee6b5f;
  --f-display: "Grenze Gotisch", "UnifrakturCook", Georgia, serif;
  --f-body: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
  /* layout: barra do grupo no topo, palco dos heróis, painéis em coluna única que abrem em duas no desktop */
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1200px 500px at 50% -120px, #2a2416 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #14222a 0%, transparent 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: clamp(34px, 6vw, 52px); }
h2 { font-size: 30px; }
h3 { font-size: 22px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px 60px; }

/* ---------- topo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 16px 0 8px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { color: var(--gold-2); text-shadow: 0 2px 0 #4a3510, 0 0 24px #eab54c33; }
.brand .back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
.brand .back:hover { color: var(--ink); border-color: var(--gold); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 15px; white-space: nowrap; }
.chip b { color: var(--gold-2); }
.chip.warn { border-color: #6a4a1a; background: #2a2012; }
.banner { margin: 6px 0 14px; padding: 10px 14px; border-radius: 10px; background: #22302a; border: 1px solid #3a5a44; font-size: 15px; }
.banner.ro { background: #2e2414; border-color: #6a4a1a; }

/* ---------- palco do grupo ---------- */
.stage {
  position: relative; margin: 10px 0 22px; padding: 18px 14px 0; border-radius: 22px; overflow: hidden;
  background: linear-gradient(#1a2530, #141c22 78%, #241b10);
  border: 1px solid var(--line);
}
.stage::before { content: ""; position: absolute; left: 50%; bottom: 8%; width: 70%; height: 40%; transform: translateX(-50%); background: radial-gradient(closest-side, #ff9a4a33, transparent); pointer-events: none; }
.lineup { position: relative; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 220px)); justify-content: center; gap: 10px; align-items: start; }
.slot { position: relative; border: 0; background: none; padding: 0 0 12px; text-align: center; border-radius: 16px; transition: transform .2s; }
.slot:hover { transform: translateY(-4px); }
.slot .fig { padding-top: 22px; height: 212px; display: flex; align-items: flex-end; justify-content: center; }
.slot .fig svg { height: 100%; width: auto; max-width: 100%; }
.slot .nm { font-family: var(--f-display); font-size: 22px; line-height: 1; color: var(--ink); overflow-wrap: anywhere; }
.slot .cl { font-size: 13px; color: var(--muted); }
.slot .lv { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); background: #0d1215cc; border: 1px solid var(--gold); color: var(--gold-2); font-weight: 800; font-size: 13px; border-radius: 999px; padding: 1px 9px; z-index: 2; }
.slot .pend { margin-top: 4px; font-size: 13px; }
.slot.empty .fig { border: 2px dashed #46586488; border-radius: 16px; margin: 36px 6px 6px; height: 176px; align-items: center; color: var(--muted); flex-direction: column; gap: 4px; font-size: 15px; }
.slot.empty .plus { font-size: 42px; line-height: 1; color: var(--gold); font-family: var(--f-display); }
.slot.empty:hover .fig { border-color: var(--gold); color: var(--ink); }
.hero-svg .aura { animation: pulse 3s ease-in-out infinite; transform-origin: 60px 86px; }
.idle { height: 100%; display: flex; align-items: flex-end; justify-content: center; animation: bob 3.2s ease-in-out infinite; }
.lineup .slot:nth-child(2) .idle { animation-delay: -.6s; } .lineup .slot:nth-child(3) .idle { animation-delay: -1.2s; } .lineup .slot:nth-child(4) .idle { animation-delay: -1.9s; } .lineup .slot:nth-child(5) .idle { animation-delay: -2.4s; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes pulse { 50% { opacity: .55; transform: scale(.94); } }

/* ---------- barras ---------- */
.bar { height: 8px; border-radius: 99px; background: #0c1114; overflow: hidden; border: 1px solid #2c3840; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #c8892a, var(--gold-2)); border-radius: 99px; transition: width .5s; }
.bar.hp > i { background: linear-gradient(90deg, #4aa64a, #8fe07a); }
.bar.hp.low > i { background: linear-gradient(90deg, #b8332f, #ee6b5f); }
.bar.ehp > i { background: linear-gradient(90deg, #a8332f, #ee8b5f); }

/* ---------- grade de painéis ---------- */
.grid2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card + .card { margin-top: 18px; }
.grid2 > .card + .card { margin-top: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--gold); font-weight: 800; }

/* ---------- desafio ---------- */
.foes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; margin: 6px 0 12px; }
.foe { width: 96px; text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.15; }
.foe svg { width: 70px; height: 70px; display: block; margin: 0 auto 4px; }
.foe.boss { width: 110px; } .foe.boss svg { width: 96px; height: 96px; }
.foe.boss span { color: var(--gold-2); font-weight: 800; }
.odds { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.odds .pct { font-family: var(--f-display); font-size: 40px; line-height: 1; min-width: 86px; text-align: center; }
.odds .pct.hi { color: var(--good); } .odds .pct.mid { color: var(--gold-2); } .odds .pct.lo { color: var(--bad); }
.tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.tag.win { background: #1f3a22; color: var(--good); } .tag.loss { background: #3a1f1f; color: var(--bad); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist li { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 6px 0; border-bottom: 1px dashed #2c3840; }

/* ---------- botões ---------- */
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 16px; font-weight: 700; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--gold); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(#f2c45e, #d79a2c); color: #2a1a06; border-color: #f7d98a; box-shadow: 0 2px 0 #7a5212; }
.btn.primary:hover { background: linear-gradient(#ffd27a, #e3a836); }
.btn.ghost { background: none; }
.btn.danger { color: var(--bad); background: none; border-color: #5a2a2a; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.sm { padding: 5px 11px; font-size: 14px; border-radius: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- herói ---------- */
.hero-head { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: center; margin: 8px 0 16px; }
.hero-head .fig { height: 210px; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(closest-side, #2a3440, transparent); }
.hero-head .fig svg { height: 100%; }
.hero-head h2 { font-size: clamp(34px, 6vw, 48px); color: var(--gold-2); overflow-wrap: anywhere; }
.hero-head .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
.xpline { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.xpline b { color: var(--ink); }
.hero-head .bar { height: 12px; }
@media (max-width: 560px) { .hero-head { grid-template-columns: 110px 1fr; gap: 12px; } .hero-head .fig { height: 150px; } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tabs .dot { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 99px; background: var(--gold); color: #2a1a06; font-size: 12px; margin-left: 6px; padding: 0 5px; }

/* ---------- tarefas ---------- */
.addtask { display: grid; gap: 10px; }
.addtask input[type="text"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 17px; }
.addtask input[type="text"]:focus { border-color: var(--gold); outline: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--bg-2); padding: 8px 12px; font-size: 15px; font-weight: 700; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { color: #1a1206; background: var(--c, var(--gold)); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }
.tasks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); border-left: 5px solid var(--c); }
.task .done-btn { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--c); background: none; display: grid; place-items: center; }
.task .done-btn:hover { background: color-mix(in srgb, var(--c) 25%, transparent); }
.task .t { font-weight: 700; overflow-wrap: anywhere; }
.task .sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.task .xp { font-weight: 800; color: var(--gold-2); white-space: nowrap; }
.task .xp s { color: var(--muted); font-weight: 400; margin-right: 4px; }
.task .del { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 2px 6px; border-radius: 6px; }
.task .del:hover { color: var(--bad); }
.task.carried { background: linear-gradient(90deg, #2a2312, var(--bg-2) 60%); }
.task.done { opacity: .6; }
.task.done .t { text-decoration: line-through; }
.task.done .done-btn { background: var(--c); color: #1a1206; }
.bonus { color: #1a1206; background: var(--gold); padding: 0 6px; border-radius: 6px; font-weight: 800; }
.section-t { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.empty-note { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

/* ---------- árvore ---------- */
.tree { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(11, auto); gap: 26px 14px; padding: 6px 0; }
.tree svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tier-lbl { position: absolute; left: -2px; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.node { position: relative; z-index: 1; border-radius: 12px; padding: 10px 10px 8px; background: var(--bg-2); border: 1.5px solid var(--line); text-align: left; min-height: 78px; display: flex; flex-direction: column; gap: 4px; }
.node .n { font-weight: 800; font-size: 15px; line-height: 1.15; }
.node .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.node .pips { display: flex; gap: 3px; margin-top: auto; }
.node .pips i { width: 14px; height: 5px; border-radius: 3px; background: #33424d; }
.node .pips i.on { background: var(--cc); }
.node.learned { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 13%, var(--bg-2)); }
.node.avail { border-color: var(--gold); box-shadow: 0 0 0 3px #eab54c22; animation: glow 2s ease-in-out infinite; }
.node.locked { opacity: .5; }
.node.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
.node.ult { grid-column: 2; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px #eab54c11; } }
.detail { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.stat .v { font-size: 22px; font-weight: 800; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
@media (max-width: 520px) { .tree { gap: 18px 8px; } .node { padding: 8px 7px; min-height: 70px; } .node .n { font-size: 13.5px; } }

/* ---------- loja ---------- */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.item { padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.item .pv { height: 84px; display: grid; place-items: center; background: radial-gradient(closest-side, #2a3440, transparent); }
.item .pv svg { height: 100%; }
.item .nm { font-weight: 800; }
.item .price { color: var(--gold-2); font-weight: 800; }
.item.owned { border-color: #3a5a44; }
.item.on { border-color: var(--gold); }
.gold { color: var(--gold-2); font-weight: 800; }
.coin { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b8, #e2a530 60%, #9a6a12); vertical-align: -.1em; box-shadow: inset 0 0 0 1px #7a5212; }

/* ---------- criação ---------- */
.create { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
.create .preview { position: sticky; top: 12px; text-align: center; }
.create .preview .fig { height: 330px; background: radial-gradient(closest-side, #2a3440, transparent); }
.create .preview .fig svg { height: 100%; }
@media (max-width: 760px) { .create { grid-template-columns: 1fr; } .create .preview { position: static; } .create .preview .fig { height: 240px; } }
.field { margin-bottom: 18px; }
.field > label, .field > .lbl { display: block; font-weight: 800; margin-bottom: 8px; }
.field input[type="text"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 20px; font-family: var(--f-display); }
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.cls { text-align: left; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg-2); display: grid; gap: 4px; }
.cls .cn { font-family: var(--f-display); font-size: 22px; color: var(--cc); line-height: 1; }
.cls .cr { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.cls .cb { font-size: 14px; color: var(--muted); }
.cls[aria-pressed="true"] { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, var(--bg-2)); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1.5px solid var(--line); background: var(--bg-2); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.opt[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-2); }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #0008; box-shadow: 0 0 0 2px transparent; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--gold-2); }

/* ---------- modal e batalha ---------- */
.modal-bg { position: fixed; inset: 0; background: #05080acc; display: grid; place-items: center; padding: 16px; z-index: 1000; animation: fade .2s; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal.wide { width: min(980px, 100%); }
@keyframes fade { from { opacity: 0; } }
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 12px 0; padding: 14px; border-radius: 14px; background: linear-gradient(#1a2530, #141c22); }
.side { display: grid; gap: 8px; align-content: start; }
.unit { position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; padding: 4px 8px 4px 4px; border-radius: 10px; transition: transform .2s, background .2s, opacity .3s; }
.unit .ic { width: 54px; height: 54px; display: grid; place-items: center; }
.unit .ic svg { height: 100%; width: auto; }
.unit .un { font-size: 13.5px; font-weight: 800; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit .uh { font-size: 11px; color: var(--muted); }
.unit.acting { background: #eab54c22; transform: scale(1.04); }
.unit.ko { opacity: .3; filter: grayscale(1); }
.unit.hitflash { animation: hit .35s; }
@keyframes hit { 30% { transform: translateX(4px); background: #ee6b5f33; } }
.floater { position: absolute; right: 8px; top: 0; font-weight: 900; font-size: 18px; pointer-events: none; animation: up 1s forwards; text-shadow: 0 2px 0 #000; }
.floater.dmg { color: #ffb0a0; } .floater.crit { color: #ffdd55; font-size: 22px; } .floater.heal { color: #8fe07a; } .floater.info { color: #bfe3ef; font-size: 13px; }
@keyframes up { to { transform: translateY(-26px); opacity: 0; } }
.feed { min-height: 46px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); font-size: 15px; }
.result { text-align: center; padding: 14px; border-radius: 12px; margin-top: 10px; }
.result h2 { font-size: 40px; }
.result.win { background: #1c3220; } .result.win h2 { color: var(--good); }
.result.loss { background: #321c1c; } .result.loss h2 { color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #0d1215; border: 1px solid var(--gold); color: var(--ink); padding: 12px 16px; border-radius: 12px; z-index: 1100; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px #000a; animation: rise .3s; max-width: calc(100% - 24px); }
.toast b { color: var(--gold-2); }
@keyframes rise { from { transform: translate(-50%, 20px); opacity: 0; } }
.lvlup { text-align: center; }
.lvlup .big { font-family: var(--f-display); font-size: 64px; color: var(--gold-2); line-height: 1; text-shadow: 0 0 30px #eab54c88; }
.loading { min-height: 60vh; display: grid; place-items: center; text-align: center; }
.loading h2 { color: var(--gold-2); }
@media (max-width: 640px) {
  .lineup { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 4px; }
  .slot .fig { height: 170px; } .slot.empty .fig { height: 136px; }
  .arena { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* ---------- quadro da guilda / mestre ---------- */
.board { border-color: #4a3d22; background: linear-gradient(#211d16, var(--panel) 120px); }
.board .addtask input[type="text"] { width: auto; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 14px 0; }
.pick { display: grid; justify-items: center; gap: 4px; padding: 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg-2); font-weight: 800; overflow-wrap: anywhere; }
.pick:hover { border-color: var(--gold); }
.pick .ic { height: 84px; display: flex; align-items: flex-end; }
.pick .ic svg { height: 100%; }
.pin-in { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 24px; letter-spacing: .3em; }
.opt[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- recompensas ---------- */
.gem { display: inline-block; width: .8em; height: .8em; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, #c9f0ff, #6ab8e8 60%, #2f6fa8); box-shadow: inset 0 0 0 1px #1f4a70; vertical-align: -.05em; }
.rewards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reward { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.reward .t { font-weight: 800; overflow-wrap: anywhere; }
.reward .xp { font-weight: 800; color: #9fd8f5; white-space: nowrap; }
.reward.ready { border-color: #4a7a9a; background: linear-gradient(90deg, #17303d, var(--bg-2) 70%); }
.txt { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 16px; }
.txt:focus { border-color: var(--gold); outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.field input.txt { font-family: var(--f-body); font-size: 16px; padding: 9px 12px; width: auto; }

/* ---------- ancestralidades ---------- */
.ancs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.anc { text-align: left; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg-2); display: grid; gap: 2px; }
.anc .an { font-weight: 800; }
.anc .ap { font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.anc[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg-2)); }
.anc[aria-pressed="true"] .an { color: var(--gold-2); }
.create .preview .stats { grid-template-columns: 1fr 1fr; }
/* ---------- cena de batalha (estilo idle) ---------- */
.battle-modal { width: min(1120px, 100%); padding: 18px; }
.scene { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #0b0f12; container-type: inline-size; border: 1px solid #3a2e1a; box-shadow: inset 0 0 0 1px #0006; }
@media (max-width: 640px) { .scene { aspect-ratio: 1 / 1; } .bu { width: calc(17% * var(--s)) !important; } .battle-modal { padding: 12px; } .modal-bg { padding: 8px; } }
.scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .units, .scene .fxl, .scene .res-ov { position: absolute; inset: 0; }
.scene .fxl { pointer-events: none; z-index: 200; }
.bu { position: absolute; width: calc(11% * var(--s)); transform: translate(-50%, -100%); }
.bu .fig { position: relative; }
.bu.hero .fig { transform: perspective(420px) rotateY(26deg); }
.bu.foe .fig { transform: perspective(420px) rotateY(-26deg); }
.bu .bob { animation: bob 2.6s ease-in-out infinite; }
.bu .fig svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 3px #000a); transform-origin: 50% 92%; transition: rotate .45s, opacity .45s, filter .3s; }
.bu .hpw { width: 72%; margin: 0 auto 3px; }
.bu .hpw .bar { height: 6px; border-color: #000a; }
.bu .bn { width: 180%; margin: -2px 0 0 -40%; text-align: center; font-size: clamp(9px, 1.15cqw, 12.5px); line-height: 1.1; font-weight: 800; text-shadow: 0 1px 2px #000; text-wrap: balance; }
.bu .bn span { background: #0b0f12b0; padding: 1px 6px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.bu.hero.lunge { animation: lungeR calc(.5s / var(--spd, 1)) ease-out; }
.bu.foe.lunge { animation: lungeL calc(.5s / var(--spd, 1)) ease-out; }
.bu.cast .fig svg { animation: castk calc(.7s / var(--spd, 1)) ease-out; }
.bu.hit .fig svg { animation: hitk .32s ease-out; }
.bu.glow .fig svg { animation: healk .7s ease-out; }
.bu.shielded .fig svg { filter: drop-shadow(0 0 7px #7adfff) drop-shadow(0 0 2px #bff); }
.bu.ko .bob { animation: none; }
.bu.ko .fig svg { opacity: .4; filter: grayscale(1) brightness(.7); }
.bu.hero.ko .fig svg { rotate: -78deg; }
.bu.foe.ko .fig svg { rotate: 78deg; }
.bu.ko .hpw { opacity: .3; }
@keyframes lungeR { 40% { translate: 3.6cqw -0.6cqw; } }
@keyframes lungeL { 40% { translate: -3.6cqw -0.6cqw; } }
@keyframes castk { 35% { filter: drop-shadow(0 0 14px #ffe48a) brightness(1.3); translate: 0 -0.6cqw; } }
@keyframes hitk { 25% { translate: .8cqw 0; filter: brightness(2.2) saturate(.2); } 60% { translate: -.4cqw 0; } }
@keyframes healk { 40% { filter: drop-shadow(0 0 14px #8fe07a) brightness(1.25); } }
.proj { position: absolute; width: 1.3cqw; height: 1.3cqw; min-width: 8px; min-height: 8px; border-radius: 50%; transform: translate(-50%, -50%); transition-property: left, top; transition-timing-function: cubic-bezier(.4, .1, .7, 1); }
.callout { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: #0d1215e8; border: 1px solid var(--gold); color: var(--gold-2); font-weight: 800; font-size: clamp(10px, 1.35cqw, 14px); padding: 2px 9px; border-radius: 99px; white-space: nowrap; z-index: 300; animation: callk 1.2s forwards; pointer-events: none; }
@keyframes callk { 0% { opacity: 0; translate: 0 6px; } 15% { opacity: 1; translate: 0 0; } 75% { opacity: 1; } 100% { opacity: 0; translate: 0 -6px; } }
.bu .floater { position: absolute; left: 50%; top: 18%; right: auto; transform: translateX(-50%); font-size: clamp(13px, 2cqw, 22px); animation: up2 1.05s forwards; z-index: 320; white-space: nowrap; }
.bu .floater.crit { font-size: clamp(16px, 2.8cqw, 30px); }
.bu .floater.info { font-size: clamp(10px, 1.3cqw, 14px); color: #cfeeff; }
.bu .floater.burn { color: #ffae6a; } .bu .floater.poison { color: #b8ff7a; }
@keyframes up2 { 0% { opacity: 0; translate: 0 6px; scale: .7; } 15% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 100% { opacity: 0; translate: var(--dx, 0) -3.2cqw; } }
.scene.shake { animation: shk .25s; }
@keyframes shk { 25% { translate: 3px -2px; } 50% { translate: -3px 2px; } 75% { translate: 2px 1px; } }
.round-chip { position: absolute; top: 10px; left: 10px; z-index: 250; background: #0d1215b8; border: 1px solid #ffffff22; padding: 3px 11px; border-radius: 99px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.res-ov { display: grid; place-items: center; z-index: 400; pointer-events: none; opacity: 0; transition: opacity .5s; background: radial-gradient(closest-side, #000b, #0004 70%, transparent); }
.res-ov.on { opacity: 1; }
.res { text-align: center; padding: 16px 22px; }
.res h2 { font-size: clamp(36px, 8cqw, 84px); text-shadow: 0 3px 0 #000, 0 0 30px currentColor; }
.res.win h2 { color: var(--gold-2); } .res.loss h2 { color: var(--bad); }
.res p { max-width: 46ch; margin: 6px auto 0; text-shadow: 0 1px 3px #000; font-weight: 700; }
.battle-modal .feed { margin-top: 10px; }
.scene .ff { animation: ffk 4s ease-in-out infinite; }
@keyframes ffk { 50% { opacity: .15; translate: 0 -10px; } }
.scene .flame { animation: flk .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flk { to { scale: .9 1.1; opacity: .85; } }
.scene .fog { animation: fogk 14s ease-in-out infinite alternate; }
@keyframes fogk { to { translate: 60px 0; } }

/* ---------- bandos e cenários novos ---------- */
.pack { position: relative; width: 100%; aspect-ratio: 1 / 1.04; }
.pack .mem { position: absolute; width: 64%; transition: opacity .4s, translate .4s; }
.pack .mem svg { width: 100%; height: auto; display: block; }
.pack .mem.gone { opacity: 0; translate: 0 10%; }
.pack.n2 .m0 { left: 0; top: 4%; } .pack.n2 .m1 { left: 36%; top: 30%; }
.pack.n3 .m0 { left: 18%; top: 0; } .pack.n3 .m1 { left: -4%; top: 34%; } .pack.n3 .m2 { left: 40%; top: 36%; }
.foe .pack { width: 70px; margin: 0 auto 4px; }
.foe .cnt { display: inline-block; margin-left: 4px; background: var(--panel-2); color: var(--gold-2); border-radius: 99px; padding: 0 6px; font-weight: 800; font-size: 11px; }
.foe.elite span.n { color: #c8b0ff; }
.scene .snow { animation: snowk 8s linear infinite; }
@keyframes snowk { from { translate: 0 -40px; } to { translate: 30px 560px; } }
.scene .ember { animation: emberk 5s linear infinite; }
@keyframes emberk { from { translate: 0 0; opacity: 1; } to { translate: -20px -260px; opacity: 0; } }
/* ---------- salas, sessão e configurações ---------- */
.gate { max-width: 980px; margin: 10px auto 0; }
.gate-hero { margin: 8px 0 20px; }
.gate-hero h2 { font-size: clamp(30px, 5vw, 44px); color: var(--gold-2); margin: 4px 0 8px; }
.code-in { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 28px !important; letter-spacing: .25em; text-transform: uppercase; font-family: var(--f-body) !important; font-weight: 800; }
.code-big { font-size: 22px; letter-spacing: .18em; color: var(--gold-2); }
.picklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.pickme { position: relative; border: 1.5px solid var(--line); background: var(--panel); border-radius: 16px; padding: 26px 10px 14px; display: grid; justify-items: center; gap: 4px; text-align: center; transition: transform .15s, border-color .15s; }
.pickme:hover { transform: translateY(-3px); border-color: var(--gold); }
.pickme .fig { height: 170px; display: flex; align-items: flex-end; }
.pickme .fig svg { height: 100%; width: auto; }
.pickme .nm { font-family: var(--f-display); font-size: 24px; line-height: 1; overflow-wrap: anywhere; }
.pickme .cl { font-size: 13px; color: var(--muted); }
.pickme .lv { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: #0d1215cc; border: 1px solid var(--gold); color: var(--gold-2); font-weight: 800; font-size: 13px; border-radius: 999px; padding: 1px 9px; }
.pickme.new { border-style: dashed; color: var(--muted); }
.pickme.new .fig { align-items: center; }
.pickme.new .plus { font-size: 56px; color: var(--gold); font-family: var(--f-display); }
.sessbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.sessbar .who { display: inline-flex; align-items: center; gap: 8px; }
.sessbar .who svg { width: 34px; height: 42px; }
.tag.crown { background: #3a2e12; color: var(--gold-2); }
.tag.must { background: #2a2140; color: #c8b0ff; }
.slot.other { cursor: default; }
.slot.other:hover { transform: none; }
.slot.mine .fig { filter: drop-shadow(0 0 12px #eab54c55); }
.range { width: 100%; accent-color: var(--gold); margin: 10px 0 2px; height: 28px; }
.range-lbl { position: relative; height: 18px; margin: 0 9px; }
.range-lbl span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.range-lbl span:first-child { transform: none; margin-left: -9px; } .range-lbl span:last-child { transform: translateX(-100%); margin-left: 9px; }


.tag.crown.co { background: #2a2a3e; color: #d8c8ff; }
.co-list { display: grid; gap: 8px; }
.co-item { display: grid; grid-template-columns: auto 40px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg-2); cursor: pointer; }
.co-item.on { border-color: #8a70d0; }
.co-item input { width: 18px; height: 18px; accent-color: var(--gold); }
.co-item .ic svg { width: 40px; height: 50px; }
/* ---------- rotina e motivação ---------- */
.task { grid-template-columns: auto 1fr auto auto; }
.tact { display: flex; gap: 2px; align-items: center; }
.task.pending { border-left-style: dashed; opacity: .85; }
.tag.late { background: #3a1f1f; color: var(--bad); } .tag.ontime { background: #1f3a2a; color: var(--good); }
.tag.streak { background: #3a2412; color: #ffb070; } .tag.evt { background: #2a1f3a; color: #e0b8ff; }
.tag.wait { background: #2e2a14; color: #f0d070; } .tag.duo { background: #14283a; color: #8fd0ff; }
.days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.dchip { border: 1.5px solid var(--line); background: var(--bg-2); border-radius: 8px; padding: 4px 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
.dchip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-2); background: #2a2212; }
.time-in { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); font-size: 15px; margin-left: 6px; color-scheme: dark; }
details.later { margin-top: 14px; } details.later summary { cursor: pointer; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
.chest-cta { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; background: linear-gradient(90deg, #3a2a10, var(--panel)); border: 1px solid #8a6a2a; }
.chest-cta.dim { background: var(--panel); border-color: var(--line); grid-template-columns: 64px 1fr; }
.chest-cta.dim .chest-ic { opacity: .55; filter: grayscale(.6); }
.chest-ic svg { width: 64px; height: 56px; display: block; }
.chest-modal { text-align: center; }
.chest-anim svg { width: 140px; height: 122px; animation: chestk .9s ease-out; }
@keyframes chestk { 0% { transform: scale(.6) rotate(-8deg); } 50% { transform: scale(1.12) rotate(4deg); } 100% { transform: scale(1); } }
.loot { list-style: none; padding: 0; margin: 12px 0 16px; display: grid; gap: 8px; }
.loot li { padding: 8px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.streak-big { font-family: var(--f-display); font-size: 30px; color: #ffb070; margin-top: 4px; }
.streakchip { border-color: #6a3a1a; background: #2a1a10; } .streakchip b { color: #ffb070; }
.kudos-btn { margin-top: 6px; }
.rank { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 26px 34px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.rank .pos { font-weight: 900; color: var(--muted); text-align: center; }
.rank .ic svg { width: 34px; height: 42px; display: block; }
.rank li.top1 { border-color: #d6a531; } .rank li.top1 .pos { color: #f4c84a; }
.rank li.top2 { border-color: #9aa6b4; } .rank li.top2 .pos { color: #c8d0d8; }
.rank li.top3 { border-color: #a8743a; } .rank li.top3 .pos { color: #d8945a; }
.feedlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14.5px; }
.feedlist li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #2c3840; }
.feedlist .when { color: var(--muted); font-size: 12.5px; }
.feedlist .k-ach span:last-child, .feedlist .k-level span:last-child { color: var(--gold-2); }
.feedlist .k-battle span:last-child { color: #8fd0ff; } .feedlist .k-kudos span:last-child { color: #ffb0c8; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.medal { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); opacity: .65; }
.medal.on { opacity: 1; border-color: #8a6a2a; }
.medal .mic svg { width: 40px; height: 48px; display: block; }
.approvals { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.approvals li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.approvals .ic svg { width: 34px; height: 42px; display: block; }
.btn .dot { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; margin-left: 6px; padding: 0 5px; }
.check input.time-in { width: auto; height: auto; accent-color: auto; }

/* ---------- relíquias e bestiário ---------- */
.item.relic { border-color: color-mix(in srgb, var(--rc) 45%, var(--line)); }
.item.relic.on { border-color: var(--rc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 25%, transparent); }
.item .rar { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.beasts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.beast { text-align: center; padding: 8px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.beast .bic svg { width: 80px; height: 80px; display: block; margin: 0 auto; }
.beast.unknown .bic svg { filter: brightness(0) opacity(.45); }
.beast.boss { border-color: #8a6a2a; }
.beast .bn { font-weight: 800; font-size: 14px; line-height: 1.15; margin-top: 2px; }

/* ---------- eventos e relatório ---------- */
.evcard { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; margin-bottom: 18px; }
.evcard.on { border-color: #6a4aa0; background: linear-gradient(120deg, #2a1f3a, var(--panel) 55%); }
.evcard.soon { opacity: .9; }
.ev-ic svg { width: 56px; height: 56px; display: block; }
.ev-goal { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.reports { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card.rep + .card.rep { margin-top: 0; }
.rep-h { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.rep-h .ic svg { width: 40px; height: 50px; display: block; }
.mini { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.rep-l { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
s.small { opacity: .6; }

/* ---------- desafio da noite em destaque ---------- */
.nightfight { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); margin: 0 0 18px; border-radius: 20px; overflow: hidden; border: 1px solid #5a4422; background: var(--panel); box-shadow: 0 10px 30px #0006; }
.nf-scene { position: relative; min-height: 300px; container-type: inline-size; overflow: hidden; isolation: isolate; }
.nf-scene .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.nf-u { position: absolute; width: calc(15% * var(--s)); transform: translate(-50%, -100%); }
.nf-u.hero .bob { transform: perspective(420px) rotateY(26deg); }
.nf-u.foe .bob { transform: perspective(420px) rotateY(-26deg); }
.nf-u .bob { animation: bob 2.8s ease-in-out infinite; }
.nf-u svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 3px #000a); }
.nf-vs { position: absolute; left: 47%; top: 44%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: clamp(28px, 7cqw, 54px); color: var(--gold-2); text-shadow: 0 3px 0 #000, 0 0 24px #eab54c88; z-index: 120; }
.nf-count { position: absolute; left: 12px; top: 12px; z-index: 130; background: #0d1215c8; border: 1px solid #ffffff22; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.nf-count b { color: var(--gold-2); }
.nf-info { padding: 18px 20px; display: flex; flex-direction: column; }
.nf-info h2 { font-size: clamp(26px, 3.2vw, 34px); color: var(--gold-2); }
.diffchip { border-color: #6a4aa0; background: #241a34; } .diffchip b { color: #d8c0ff; }
.nf-foes { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.nf-foes li { font-size: 13.5px; padding: 3px 10px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); }
.nf-foes .cnt { color: var(--gold-2); font-weight: 800; }
@media (max-width: 860px) { .nightfight { grid-template-columns: 1fr; } .nf-scene { min-height: 0; aspect-ratio: 16 / 9; } .nf-u { width: calc(17% * var(--s)); } }

.seg.wrap { flex-wrap: wrap; }
.num-in { width: 64px !important; text-align: center; }
.freq { color: #8fd0ff; }

/* ===== Aniversário ===== */
.coin.festa { background: radial-gradient(circle at 35% 35%, #ffe0f0, #f06ba3 60%, #9a2a5a); box-shadow: inset 0 0 0 1px #7a1a4a; }
.festa-chip { border-color: #8a3a62; }
.date-in { color-scheme: dark; min-height: 44px; }
.chest-cta.bday-cta { background: linear-gradient(90deg, #4a1a34, var(--panel)); border-color: #b04a80; }
.chest-cta.bday-cta.dim { background: var(--panel); border-color: #6a3a52; }
.chest-cta.bday-cta.dim .chest-ic { opacity: 1; filter: none; }
.bday-cta .chest-ic svg { animation: giftHop 1.6s ease-in-out infinite; }
.chest-cta.dim.bday-cta .chest-ic svg { animation: none; }
@keyframes giftHop { 0%, 70%, 100% { transform: none; } 78% { transform: translateY(-5px) rotate(-6deg); } 86% { transform: translateY(-2px) rotate(5deg); } }

/* ===== Efeitos visuais das habilidades ===== */
.vx { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }

@keyframes vxburstB { from { width: 10px; height: 10px; opacity: 1; } to { width: 130px; height: 130px; opacity: 0; } }
.vx.spark { width: 7px; height: 7px; border-radius: 50%; background: var(--vc); box-shadow: 0 0 8px 2px var(--vc); animation: vxspark calc(.6s / var(--spd, 1)) ease-out forwards; }
.vx.spark.e-ice { border-radius: 1px; rotate: 45deg; background: #e8fbff; }

.vx.spark.e-curse, .vx.spark.e-dark { background: #2a1030; box-shadow: 0 0 10px 3px var(--vc); }
@keyframes vxspark { to { translate: var(--tx) var(--ty); opacity: 0; scale: .3; } }
.vx.shard { width: 8px; height: 22px; background: linear-gradient(#ffffff, var(--vc)); clip-path: polygon(50% 0, 100% 100%, 0 100%); rotate: var(--rot); animation: vxshard calc(.6s / var(--spd, 1)) ease-out forwards; }
@keyframes vxshard { from { scale: .2; opacity: 1; } 40% { scale: 1.1; } to { scale: 1; opacity: 0; translate: 0 -10px; } }
.vx.slash { width: 70px; height: 70px; border-radius: 50%; border-top: 5px solid var(--vc); rotate: var(--rot); filter: drop-shadow(0 0 6px var(--vc)); animation: vxslash calc(.35s / var(--spd, 1)) ease-out forwards; }
.vx.slash.claw { border-top-width: 3px; box-shadow: inset 0 6px 0 -3px var(--vc), inset 0 12px 0 -7px var(--vc); }
@keyframes vxslash { from { opacity: 0; scale: .6; rotate: calc(var(--rot) - 50deg); } 30% { opacity: 1; } to { opacity: 0; scale: 1.1; rotate: calc(var(--rot) + 40deg); } }
.vx.note { font-size: 22px; font-weight: 900; color: var(--vc); text-shadow: 0 0 8px var(--vc); animation: vxrise calc(.8s / var(--spd, 1)) ease-out forwards; }
.vx.vproj { width: 14px; height: 14px; border-radius: 50%; background: var(--vc); box-shadow: 0 0 14px 5px var(--vc); transition-property: left, top; transition-timing-function: ease-in; display: grid; place-items: center; }
.vx.vproj.e-fire { width: 18px; height: 18px; background: radial-gradient(circle at 40% 40%, #fff3c0, #ffb84a 40%, #ff5a1a); box-shadow: 0 0 18px 8px #ff7a3a99; }
.vx.vproj.e-ice { width: 10px; height: 22px; border-radius: 2px; background: linear-gradient(#fff, #8fd8f5); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); rotate: calc(var(--rot) + 90deg); box-shadow: none; filter: drop-shadow(0 0 6px #8fd8f5); }
.vx.vproj.e-arrow, .vx.vfall.e-arrow { width: 34px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, #c8a060 30%, #f0e6c8); box-shadow: none; rotate: var(--rot); }
.vx.vproj.e-arrow i, .vx.vfall.e-arrow i { position: absolute; right: -5px; top: -3px; border-left: 8px solid #e8e8f0; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.vx.vproj.e-music, .vx.vproj.e-royal { width: auto; height: auto; background: none; box-shadow: none; font-size: 24px; font-weight: 900; color: var(--vc); text-shadow: 0 0 10px var(--vc); }
.vx.vproj.e-curse, .vx.vproj.e-shadow { background: radial-gradient(circle, #2a1030 30%, var(--vc)); box-shadow: 0 0 16px 6px var(--vc); }
.vx.vproj.e-holy { background: radial-gradient(circle, #fff 30%, var(--vc)); box-shadow: 0 0 20px 8px #ffe48a88; }
.vx.vproj.e-spirit { width: 20px; height: 12px; border-radius: 50% 60% 60% 50%; rotate: var(--rot); opacity: .9; }
.vx.vproj.e-tech { width: 12px; height: 12px; border-radius: 2px; rotate: 45deg; }
.vx.vproj.e-poison, .vx.vproj.e-nature { background: radial-gradient(circle at 40% 40%, #e8ffc8, var(--vc)); }
.vx.vfall { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff3c0, var(--vc) 45%, #6a2a10); box-shadow: 0 0 22px 10px #ff7a3a88; transition-property: left, top; transition-timing-function: ease-in; }
.vx.vfall.e-bomb { width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #8a8a92, #22222c); box-shadow: 0 0 10px 3px #ffb84a; }
.vx.vfall.e-arrow { rotate: 63deg; }
.vx.bolt { left: 0; top: 0; width: 100%; height: 100%; transform: none; animation: vxfade calc(.38s / var(--spd, 1)) steps(3) forwards; filter: drop-shadow(0 0 8px var(--vc)); }
@keyframes vxfade { to { opacity: 0; } }
.vx.pillar { width: 46px; height: 160px; transform: translate(-50%, -82%); background: linear-gradient(transparent, var(--vc) 40%, transparent); opacity: 0; border-radius: 20px; animation: vxpillar calc(1s / var(--spd, 1)) ease-out forwards; filter: blur(2px); }
@keyframes vxpillar { 20% { opacity: .75; } to { opacity: 0; scale: .6 1; } }
.vx.rise { font-weight: 900; font-size: 18px; color: var(--vc); text-shadow: 0 0 8px var(--vc); opacity: 0; animation: vxrise calc(1s / var(--spd, 1)) ease-out forwards; }
@keyframes vxrise { 0% { opacity: 0; translate: 0 6px; } 25% { opacity: 1; } 100% { opacity: 0; translate: 0 -46px; } }
.vx.sink { font-size: 14px; color: var(--vc); text-shadow: 0 0 6px var(--vc); opacity: 0; animation: vxsink calc(1s / var(--spd, 1)) ease-in forwards; }
@keyframes vxsink { 0% { opacity: 0; translate: 0 -10px; } 30% { opacity: 1; } 100% { opacity: 0; translate: 0 26px; } }
.vx.ring { width: 20px; height: 8px; border-radius: 50%; border: 3px solid var(--vc); box-shadow: 0 0 10px var(--vc); transform: translate(-50%, 60%); animation: vxring calc(1s / var(--spd, 1)) ease-out forwards; }
@keyframes vxring { to { width: 110px; height: 34px; opacity: 0; } }
.vx.bubble { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--vc); background: radial-gradient(circle at 35% 30%, #ffffff55, var(--vc) 140%); opacity: 0; animation: vxbubble calc(1.1s / var(--spd, 1)) ease-out forwards; }
@keyframes vxbubble { 20% { opacity: .7; scale: 1.05; } 70% { opacity: .5; scale: 1; } to { opacity: 0; scale: 1.15; } }
.vx.swirl { width: 74px; height: 74px; border-radius: 50%; border: 4px dashed var(--vc); box-shadow: 0 0 16px var(--vc), inset 0 0 16px var(--vc); opacity: 0; animation: vxswirl calc(1s / var(--spd, 1)) ease-in-out forwards; }
@keyframes vxswirl { 20% { opacity: .9; } to { opacity: 0; rotate: 300deg; scale: .5; } }
.vx.wave { left: 0; top: 30%; width: 100%; height: 55%; transform: none; background: linear-gradient(90deg, transparent, var(--vc), transparent); opacity: .0; mix-blend-mode: screen; animation: vxwave ease-out forwards; background-size: 40% 100%; background-repeat: no-repeat; filter: blur(8px); border-radius: 40%; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.vx.wave.rev { animation-name: vxwaveR; }
@keyframes vxwave { 0% { opacity: .65; background-position: -40% 0; } 100% { opacity: 0; background-position: 140% 0; } }
@keyframes vxwaveR { 0% { opacity: .65; background-position: 140% 0; } 100% { opacity: 0; background-position: -40% 0; } }
.vx.flash { left: 0; top: 0; width: 100%; height: 100%; transform: none; background: radial-gradient(circle at 60% 55%, var(--vc), transparent 70%); mix-blend-mode: screen; animation: vxflash ease-out forwards; }
@keyframes vxflash { 0% { opacity: 0; } 25% { opacity: .55; } 100% { opacity: 0; } }
.scene.quake { animation: vxquake calc(.5s / var(--spd, 1)) linear; }
@keyframes vxquake { 10%, 50%, 90% { translate: -4px 2px; } 30%, 70% { translate: 4px -2px; } }
/* Princesa: estrelas, arco-íris e unicórnios */
.vx.gspark { font-size: 14px; line-height: 1; color: var(--vc); text-shadow: 0 0 8px var(--vc); animation: vxgspark calc(.75s / var(--spd, 1)) ease-out forwards; }
@keyframes vxgspark { 0% { opacity: 1; scale: .4; } 60% { opacity: 1; } 100% { translate: var(--tx) var(--ty); opacity: 0; scale: 1.1; rotate: 160deg; } }
.vx.twinkle { font-size: 34px; line-height: 1; color: var(--vc); text-shadow: 0 0 14px #fff, 0 0 26px #ffe27a; animation: vxtwinkle calc(.6s / var(--spd, 1)) ease-out forwards; }
@keyframes vxtwinkle { 0% { opacity: 0; scale: .2; rotate: -40deg; } 35% { opacity: 1; scale: 1.25; } 100% { opacity: 0; scale: .8; rotate: 50deg; } }
.vx.burst.rb { border: none; box-shadow: none; background: conic-gradient(#ff6b6b, #ffb04a, #ffe66b, #7be07b, #6bc8ff, #9b8bff, #e08bff, #ff6b6b); -webkit-mask: radial-gradient(circle, transparent 54%, #000 57%); mask: radial-gradient(circle, transparent 54%, #000 57%); filter: drop-shadow(0 0 6px #ffffffaa); }
.vx.vproj.e-star, .vx.vproj.e-unicorn, .vx.vproj.e-rainbow { width: auto; height: auto; background: none; box-shadow: none; line-height: 1; }
.vx.vproj.e-star { font-size: 26px; color: #ffe27a; text-shadow: 0 0 10px #ffd24a, 0 0 20px #fff3b0; animation: vxspin calc(.5s / var(--spd, 1)) linear infinite; }
.vx.vproj.e-unicorn { font-size: 32px; filter: drop-shadow(0 0 8px #f6b8ff) drop-shadow(0 0 3px #fff); animation: vxhop calc(.24s / var(--spd, 1)) ease-in-out infinite alternate; }
.vx.vproj.e-unicorn.flip, .vx.gallop.flip { scale: -1 1; }
.vx.vproj.e-rainbow { font-size: 16px; background: conic-gradient(#ff6b6b, #ffe66b, #7be07b, #6bc8ff, #e08bff, #ff6b6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes vxspin { to { rotate: 360deg; } }
@keyframes vxhop { from { translate: 0 0; } to { translate: 0 -7px; } }
.vx.vfall.e-star { width: auto; height: auto; background: none; box-shadow: none; font-size: 34px; line-height: 1; color: #ffe27a; text-shadow: 0 0 12px #ffd24a, 0 0 26px #fff3b0; }
.vx.vfall.e-star i { position: absolute; right: 50%; top: 50%; width: 90px; height: 4px; margin-top: -2px; border-radius: 2px; transform-origin: right center; rotate: 76deg; background: linear-gradient(90deg, transparent, #fff6c0); box-shadow: 0 0 8px #ffe27a; }
.vx.vsvg { left: 0; top: 0; transform: none; overflow: visible; }
.vx.vsvg svg { overflow: visible; display: block; }
.vx.vsvg path { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .9; filter: drop-shadow(0 0 3px #ffffff88); }
.vx.vsvg.rbarc path { animation: vxdraw var(--dur) ease-out forwards, vxfade calc(.6s / var(--spd, 1)) ease-in var(--dur) forwards; }
.vx.vsvg.sky path { opacity: .55; animation: vxdraw calc(var(--dur) * .45) ease-out forwards, vxfade calc(var(--dur) * .4) ease-in calc(var(--dur) * .6) forwards; }
@keyframes vxdraw { to { stroke-dashoffset: 0; } }
.vx.gallop { font-size: 46px; line-height: 1; filter: drop-shadow(0 0 10px #f6b8ff) drop-shadow(0 0 4px #fff); z-index: 200; }
.vx.trail { line-height: 1; color: var(--vc); text-shadow: 0 0 6px var(--vc); animation: vxtrail calc(.6s / var(--spd, 1)) ease-out forwards; }
@keyframes vxtrail { to { opacity: 0; translate: 0 14px; scale: .4; } }
.vx.shower { line-height: 1; color: var(--vc); text-shadow: 0 0 10px #ffd24a; opacity: 0; animation: vxshower calc(.9s / var(--spd, 1)) ease-in forwards; }
@keyframes vxshower { 0% { opacity: 0; translate: 0 0; } 15% { opacity: 1; } 100% { opacity: 0; translate: 50px 220px; rotate: 200deg; } }
.vx.minibow { width: 64px; height: 32px; border-radius: 64px 64px 0 0; background: radial-gradient(circle at 50% 100%, transparent 38%, #e08bff 39%, #9b8bff 47%, #6bc8ff 55%, #7be07b 63%, #ffe66b 71%, #ffb04a 79%, #ff6b6b 87%, transparent 90%); opacity: 0; animation: vxminibow calc(1.1s / var(--spd, 1)) ease-out forwards; }
@keyframes vxminibow { 20% { opacity: .9; scale: 1.05; } 70% { opacity: .8; } 100% { opacity: 0; translate: 0 -10px; } }
.vx.bubble.rb { border: none; background: radial-gradient(circle at 35% 30%, #ffffffaa, transparent 40%), conic-gradient(from 30deg, #ff6b6b55, #ffe66b55, #7be07b55, #6bc8ff55, #e08bff55, #ff6b6b55); box-shadow: 0 0 16px #ffd0ef, inset 0 0 12px #fff8; }
.vx.orbit { width: 70px; height: 24px; animation: vxorbit linear forwards; }
.vx.orbit b { position: absolute; top: 0; font-size: 15px; color: var(--vc); text-shadow: 0 0 8px var(--vc); }
.vx.orbit b:nth-child(1) { left: 0; } .vx.orbit b:nth-child(2) { left: 28px; top: -8px; color: #ffe27a; } .vx.orbit b:nth-child(3) { right: 0; }
@keyframes vxorbit { 0% { opacity: 0; rotate: 0deg; } 20% { opacity: 1; } 100% { opacity: 0; rotate: 360deg; } }
.vx.wave.rb { background-image: linear-gradient(90deg, transparent, #ff6b6b, #ffe66b, #7be07b, #6bc8ff, #e08bff, transparent); }
@media (prefers-reduced-motion: reduce) { .vx { display: none; } .scene.quake { animation: none; } }

/* ===== Destaques da batalha ===== */
.mvp { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mvp li { display: grid; grid-template-columns: 34px 44px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.mvp li.top { border-color: var(--gold); background: linear-gradient(90deg, #3a2a10aa, var(--bg-2)); }
.mvp .rk { font-size: 20px; text-align: center; font-weight: 800; color: var(--gold-2); }
.mvp .ic svg { width: 44px; height: 56px; display: block; }
.mvp .bar.thin { height: 6px; margin: 5px 0; }
.mv-parts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.mv-parts span { white-space: nowrap; }
.mvp-line { margin-top: 10px; font-size: 15px; color: var(--gold-2); }
@media (max-width: 520px) { .mvp li { grid-template-columns: 28px 36px 1fr; padding: 8px; } .mvp .ic svg { width: 36px; height: 46px; } }

/* ===== Responsáveis das missões ===== */
.who-field { margin: 4px 0 0; }
.who-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.who-item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--bg-2); cursor: pointer; font-size: 14px; user-select: none; }
.who-item input { position: absolute; opacity: 0; pointer-events: none; }
.who-item .wi { position: relative; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #ffffff10; flex: none; }
.who-item .wi svg { position: absolute; width: 48px; height: 60px; left: 50%; top: -9px; transform: translateX(-50%); }
.who-item.any .wi { color: var(--gold-2); font-size: 15px; }
.who-item.on { border-color: var(--gold); background: #3a2a10; color: var(--gold-2); }
.who-item:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
.tag.who { background: #24324a; color: #bcd4ff; }

/* ===== Tutorial ===== */
.tut { position: fixed; inset: 0; z-index: 2000; }
.tut-hole { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px #05080ad0, 0 0 0 3px var(--gold), 0 0 24px 6px #eab54c66; transition: all .25s ease; pointer-events: none; }
.tut-pop { position: fixed; width: min(380px, calc(100vw - 16px)); background: var(--panel); border: 1px solid var(--gold); border-radius: 16px; padding: 16px 18px; box-shadow: 0 18px 50px #000c; animation: fade .2s; }
.tut-pop h3 { margin: 4px 0 6px; color: var(--gold-2); }
.tut-pop p { margin: 0 0 10px; line-height: 1.45; }
.tut-dots { display: flex; gap: 5px; margin: 0 0 12px; }
.tut-dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffffff30; }
.tut-dots i.on { background: var(--gold); width: 18px; border-radius: 4px; }

/* ===== Zoom da loja ===== */
.item .pv.zoomable { position: relative; width: 100%; border: 0; cursor: zoom-in; border-radius: 10px; padding: 0; color: inherit; }
.item .pv.zoomable:hover, .item .pv.zoomable:focus-visible { background: radial-gradient(closest-side, #3a4656, transparent); outline: none; }
.zoom-hint { position: absolute; right: 6px; bottom: 4px; font-size: 14px; opacity: .55; transition: opacity .2s; }
.item .pv.zoomable:hover .zoom-hint { opacity: 1; }
.zoom-modal { width: min(620px, calc(100vw - 16px)); }
.zpanes { display: grid; gap: 10px; margin: 12px 0 10px; }
.zpanes.two { grid-template-columns: 1fr 1fr; }
.zview { height: min(52vh, 400px); overflow: hidden; border-radius: 14px; background: radial-gradient(circle at 50% 45%, #2e3a48, #141a20 75%); border: 1px solid var(--line); display: grid; place-items: center; }
.zin { width: 100%; height: 100%; display: grid; place-items: center; transition: transform .3s ease; }
.zin svg { height: 92%; width: auto; }
.zctl { gap: 10px; flex-wrap: wrap; }
@media (max-width: 520px) { .zview { height: 40vh; } }

/* ===== Elogios com emoji ===== */
.kudos-emo { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 6px auto 0; min-height: 24px; font-size: 19px; line-height: 1; }
.kudos-emo .ke { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #ffffff10; border: 1px solid #ffffff1a; animation: kpop .4s ease-out; }
@keyframes kpop { from { transform: scale(.3); } 70% { transform: scale(1.2); } }
.hero-head .kudos-emo { position: relative; z-index: 2; margin-top: -6px; }
.modal .lbl { display: block; font-weight: 800; margin: 10px 0 2px; }
.emo-pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.emo-pick .emo { width: 46px; height: 46px; font-size: 25px; line-height: 1; border-radius: 12px; background: var(--bg-2); border: 1.5px solid var(--line); cursor: pointer; display: grid; place-items: center; padding: 0; }
.emo-pick .emo:hover { border-color: #ffffff40; }
.emo-pick .emo[aria-pressed="true"] { border-color: var(--gold); background: #3a2a10; transform: scale(1.08); box-shadow: 0 0 0 3px #eab54c33; }

/* ===== Conta e troca de salas ===== */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.acct-card { margin-bottom: 18px; }
.acct-form { display: grid; gap: 10px; margin-top: 12px; grid-template-columns: 1fr 1fr; align-items: end; }
.acct-form .field { margin: 0; }
.acct-form .row, .acct-form p { grid-column: 1 / -1; }
@media (max-width: 640px) { .acct-form { grid-template-columns: 1fr; } }
.my-rooms { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.my-rooms li { display: flex; align-items: stretch; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.my-rooms .room-go { flex: 1; display: grid; gap: 2px; text-align: left; padding: 10px 12px; background: none; border: 0; color: var(--ink); cursor: pointer; }
.my-rooms .room-go:hover { background: #ffffff0a; }
.my-rooms .room-go b { color: var(--gold-2); font-size: 16px; }
.my-rooms .del { align-self: center; margin-right: 6px; }
.chip.room-sw { padding: 0 4px 0 10px; }
.chip.room-sw select { background: transparent; color: var(--ink); border: 0; font-weight: 700; padding: 6px 6px; max-width: 220px; cursor: pointer; }
.chip.room-sw select option { background: var(--panel); color: var(--ink); }

/* ===== Quadro: rostos dos responsáveis e filtro ===== */
.task .t .faces { display: inline-flex; vertical-align: middle; margin-left: 8px; }
.faces .face + .face { margin-left: -7px; }
.face { position: relative; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: inline-grid; place-items: center; background: var(--bg-2); border: 1.5px solid var(--line); flex: none; }
.face svg { position: absolute; width: 44px; height: 55px; left: 50%; top: -8px; transform: translateX(-50%); }
.faces.any .face { border-style: dashed; }
.face.did { border-color: var(--good); box-shadow: 0 0 0 2px #7fd37a44; }
.board-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
.board-filter .who-item { font: inherit; color: var(--ink); }
.board-filter .who-item.on { color: var(--gold-2); }
.tag.sched { color: #9fd8ff; border-color: #9fd8ff55; background: #9fd8ff14; }
.del.undo { color: var(--gold-2); font-size: 17px; }
.del.undo:hover { background: #3a2a10; }
.when .date-in { min-width: 150px; }
/* convite por link */
.invite-hi { margin: 8px auto 12px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--gold, #e8b84a) 55%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--gold, #e8b84a) 12%, transparent); max-width: 560px; }
.invite-link { display: flex; gap: 8px; }
.invite-link input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: inherit; font: inherit; font-size: 14px; }
.modal.invite a.btn { text-decoration: none; }
/* limite diário de XP e destaque do dia */
.num-in.wide { width: 110px !important; }
.xpcfg .row { gap: 10px; flex-wrap: wrap; align-items: center; }
.cap-card.full .bar i { background: var(--bad, #e06464); }
.mvp-day { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(232, 184, 74, .08); border: 1px dashed rgba(232, 184, 74, .35); }

/* salão: espaço fixo embaixo de cada herói (sequência, elogios, botão) para todos ficarem alinhados */
.slot-foot { display: grid; grid-template-rows: 20px 34px 34px; justify-items: center; align-items: center; margin-top: 4px; }
.slot-tags { display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 20px; }
.kudos-row { min-height: 34px; display: flex; align-items: center; justify-content: center; }
.kudos-row .kudos-emo { margin: 0; }
.kudos-act { min-height: 34px; display: flex; align-items: center; }
.kudos-sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 4px; }
.kudos-sum .ks { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
.kudos-sum .ke { font-size: 16px; line-height: 1; }
.kudos-sum .ks-last { flex-basis: 100%; }
/* menu suspenso */
.navmenu { position: relative; }
.nav-btn .dot { margin-left: 6px; }
.nav-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 270px; max-height: 75vh; overflow: auto; background: #141c22; border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.nav-g { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 800; padding: 10px 10px 4px; }
.nav-it { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 7px 10px; border-radius: 8px; font: inherit; cursor: pointer; }
.nav-it:hover, .nav-it:focus-visible { background: rgba(255,255,255,.07); }
.nav-it .small { font-size: 12px; }
.hero-cta { display: flex; align-items: center; gap: 14px; margin: -6px 0 18px; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(234,181,76,.4); background: linear-gradient(90deg, rgba(234,181,76,.12), rgba(234,181,76,.03)); }
.hero-cta .ic { width: 46px; height: 54px; flex: none; }
.hero-cta .ic svg { width: 100%; height: 100%; }
.hero-cta > div:nth-child(2) { flex: 1; }
@media (max-width: 640px) { .hero-cta { flex-wrap: wrap; } .nav-pop { position: fixed; left: 10px; right: 10px; top: 60px; min-width: 0; } }
/* contas, donos, salas */
.linkbtn { background: none; border: 0; color: var(--gold-2); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
.warn-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: rgba(224,100,100,.1); border: 1px solid rgba(224,100,100,.35); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rc-code { font-size: 26px; letter-spacing: .08em; font-weight: 800; text-align: center; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.3); border: 1px dashed var(--gold); color: var(--gold-2); user-select: all; }
.rc-in { text-transform: uppercase; letter-spacing: .06em; }
.pickme .tag { margin-top: 6px; }
.tag.own { background: rgba(99,199,132,.15); color: #8de0a8; border-color: rgba(99,199,132,.4); }
.tag.free { background: rgba(234,181,76,.12); color: var(--gold-2); }
.tag.org { background: rgba(122,170,255,.12); color: #a8c4ff; }
.tag.lock { background: rgba(255,255,255,.05); color: var(--muted); }
.pickme.locked { opacity: .55; cursor: not-allowed; }
.pickme.locked:hover { transform: none; }
.import-card { margin-top: 16px; text-align: left; }
.kick-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.kick-list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.03); }
.kick-list li > span:nth-child(2) { flex: 1; }
.kick-list .ic { width: 34px; height: 40px; flex: none; }
.kick-list .ic svg { width: 100%; height: 100%; }
.btn.danger { background: #b8413c; border-color: #d0605a; color: #fff; }
.btn.ghost.danger { background: transparent; color: #ff9a92; border-color: rgba(224,100,100,.45); }
.sel { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: inherit; font: inherit; width: 100%; }
.bday-fixed { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.room-cfg .field { margin-bottom: 10px; }
.hidden { display: none !important; }
.perm-note { margin-bottom: 14px; }
/* trocar de classe */
.cls-modal { max-width: 720px; }
.cls-pv { display: flex; gap: 14px; align-items: center; margin: 8px 0 12px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.04); }
.cls-pv .fig { width: 76px; height: 92px; flex: none; }
.cls-pv .fig svg { width: 100%; height: 100%; }
.classes.compact { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); max-height: 40vh; overflow: auto; }
.classes.compact .cls { padding: 8px 10px; }

  /* ----- Quem mais ajudou na batalha ----- */
  // pontos: dano causado + dano absorvido x0,5 + cura + escudos x0,7 + cada bênção ou enfraquecimento vale 4% da vida total dos inimigos
  const SCORE_W = { dmg: 1, tank: 0.5, heal: 1, shield: 0.7 };
  const NEUTRAL_FLAGS = new Set(['esquiva', 'caiu', 'cura', 'escudo', 'renasce', 'crit', 'espinhos', '']);
  let contribCache = { id: null, v: null };
  function battleContrib(bt) {
    const units = {}; for (const u of bt.units) units[u.id] = u;
    const heroes = bt.units.filter((u) => u.side === 'h');
    const enemyHp = bt.units.filter((u) => u.side === 'e').reduce((a, u) => a + u.maxHp, 0);
    const V = Math.max(5, Math.round(enemyHp * 0.04));
    const R = {}; for (const h of heroes) R[h.id] = { id: h.id, name: h.name, cls: h.cls, dmg: 0, tank: 0, heal: 0, shield: 0, buff: 0, debuff: 0 };
    for (const ev of bt.log || []) {
      for (const f of ev.fx || []) {
        const [id, amt, , flag, by] = f; const tgt = units[id]; if (!tgt) continue;
        const who = by || (ev.tick ? null : ev.a); const src = who && units[who];
        if (amt < 0) {
          if (tgt.side === 'h' && R[id]) R[id].tank += -amt;
          if (tgt.side === 'e' && src && src.side === 'h' && R[who]) R[who].dmg += -amt;
        } else if (!ev.tick && src && src.side === 'h' && R[who]) {
          if (flag === 'cura' && tgt.side === 'h') R[who].heal += amt;
          else if (flag === 'renasce' && tgt.side === 'h' && who !== id) R[who].heal += amt * 1.5;
          else if (flag === 'escudo') R[who].shield += amt;
          else if (amt === 0 && !NEUTRAL_FLAGS.has(flag) && ev.s) { if (tgt.side === 'h') R[who].buff++; else R[who].debuff++; }
        }
      }
    }
    const list = Object.values(R).map((r) => Object.assign(r, { score: Math.round(r.dmg * SCORE_W.dmg + r.tank * SCORE_W.tank + r.heal * SCORE_W.heal + r.shield * SCORE_W.shield + (r.buff + r.debuff) * V) }));
    return { list: list.sort((a, b) => b.score - a.score), V };
  }
  function lastContrib() {

  const daysTxt = (days) => days && days.length && days.length < 7 ? days.slice().sort().map((d) => D.WEEKDAYS[d]).join(', ') : '';
  function taskMeta(t, x) {
    const bits = [];
    if (t.chore) bits.push('<span class="tag must">Obrigatória</span>');
    bits.push(`<span style="color:${D.DIFF[t.diff].color}">${D.DIFF[t.diff].name}</span>`);
    if (freqTxt(t)) bits.push(`<span class="freq">${freqTxt(t)}</span>`);
    if (!visibleToday(t) && !t.done) {
      if (t.repeat || hasSchedule(t)) { const n = nextOn(t, dueDay(t) > today() ? dueDay(t) : addDays(today(), 1)); if (n) bits.push(`<span class="tag sched">${dueDay(t) > today() && t.from ? 'Começa' : 'Próxima'}: ${D.WEEKDAYS[dowOf(n)].toLowerCase()}, ${fmtDay(n)}</span>`); }
      else if (dueDay(t) > today()) bits.push(`<span class="tag sched">Agendada: ${D.WEEKDAYS[dowOf(dueDay(t))].toLowerCase()}, ${fmtDay(dueDay(t))}</span>`);

    if (x.streak && !t.done) bits.push(`<span class="tag streak">Sequência +${Math.round(x.streak * 100)}%</span>`);
    if (x.ev && !t.done) bits.push(`<span class="tag evt">Evento +${Math.round(x.ev * 100)}%</span>`);
    if (t.pending) bits.push('<span class="tag wait">Aguardando aprovação</span>');

    return bits.join('');

  function dayChips(sel, act) { return `<div class="days" role="group" aria-label="Dias da semana">${D.WEEKDAYS.map((n, i) => `<button type="button" class="dchip" data-act="${act || 'day'}" data-v="${i}" aria-pressed="${(sel || []).includes(i)}">${n}</button>`).join('')}</div>`; }

      <form class="card addtask${canMake('tasks', h.id) ? '' : ' hidden'}" data-form="task"><div class="eyebrow">Nova tarefa</div>

        <div class="row"><div class="seg" role="group" aria-label="Para quem"><button type="button" data-act="target" data-v="me" aria-pressed="${S.newTarget === 'me'}">Só para ${esc(h.name)}</button><button type="button" data-act="target" data-v="guild" aria-pressed="${S.newTarget === 'guild'}">Quadro da guilda</button></div>
          ${S.newTarget === 'guild' ? `<label class="check"><input type="checkbox" id="task-duo" ${S.newDuo ? 'checked' : ''}> Em dupla</label>` : ''}</div>
        ${freqControls(newFreqState(), 'new')}
        <div class="row"><label class="check" for="task-due">Até que horas? <input type="time" id="task-due" class="time-in" value="${esc(S.newDue)}"></label><span class="spacer"></span><button class="btn primary" type="submit" ${S.readOnly ? 'disabled' : ''}>Adicionar</button></div>
      </form>
      ${carried.length ? `<div class="section-t"><h3>Acumuladas</h3><span class="small muted">Valem +${Math.round(D.CARRY_BONUS * 100)}% de XP, mas o grupo luta sem essa força esta noite.</span></div><ul class="tasks">${carried.map(taskRow).join('')}</ul>` : ''}
      <div class="section-t"><h3>Para hoje</h3><span class="small muted">${D.WEEKDAYS[dowOf(t)]}, ${fmtDay(t)}</span></div>

      ${pend.length ? `<div class="section-t"><h3>Aguardando aprovação</h3><span class="small muted">O XP entra quando um criador aprovar.</span></div><ul class="tasks">${pend.map(taskRow).join('')}</ul>` : ''}
      ${bo.length ? `<div class="section-t"><h3>Quadro da guilda</h3><span class="small muted">Qualquer herói pode cumprir.</span></div><ul class="tasks">${bo.filter((x) => !x.done).concat(bo.filter((x) => x.done)).map((x) => boardRow(x, true)).join('')}</ul>` : ''}

      ${later.length ? `<details class="later" ${S.showLater ? 'open' : ''}><summary data-act="toggleLater">Outros dias (${later.length})</summary><ul class="tasks">${later.map(taskRow).join('')}</ul></details>` : ''}
    </div><div>
      ${xpCap() ? (() => { const c = xpCap(); const used = Math.min(c, ((h.log || {})[t] || {}).tx || 0); return `<section class="card cap-card${used >= c ? ' full' : ''}"><div class="eyebrow">Limite diário de XP</div><div class="row" style="justify-content:space-between"><b class="num">${used} / ${c} XP</b><span class="small muted">${used >= c ? 'Atingido: as tarefas de hoje não dão mais XP' : `Faltam ${c - used} XP hoje`}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.round((used / c) * 100)}%"></i></div><p class="small muted" style="margin:6px 0 0">Mesmo depois do limite, as tarefas contam para o destaque do dia.</p></section>`; })() : ''}
      <section class="card"><div class="eyebrow">Sua sequência</div><div class="streak-big"><span class="num">${sn}</span> dia${sn === 1 ? '' : 's'} seguido${sn === 1 ? '' : 's'}</div>

  /* ----- Relatório semanal (para os criadores) ----- */
  function reportView() {
    if (!isCreator()) return '<div class="card"><h3>O relatório é para os criadores da sala.</h3></div>';
    const t = today(); const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6)); const prev = Array.from({ length: 7 }, (_, i) => addDays(t, i - 13));
    const sum = (h, ds, k) => ds.reduce((a, d) => a + ((h.log && h.log[d] && h.log[d][k]) || 0), 0);
    const hs = heroList();
    const tot = hs.reduce((a, h) => a + sum(h, days, 't'), 0), totPrev = hs.reduce((a, h) => a + sum(h, prev, 't'), 0);
    const xpTot = hs.reduce((a, h) => a + sum(h, days, 'x'), 0);
    const cmp = (a, b) => b ? `${a >= b ? '+' : ''}${Math.round(((a - b) / b) * 100)}% em relação aos 7 dias anteriores` : a ? 'Primeira semana com registro' : 'Sem tarefas registradas';
    const maxT = Math.max(1, ...hs.map((h) => Math.max(...days.map((d) => (h.log && h.log[d] && h.log[d].t) || 0))));
    const chart = (h) => { const W = 280, Hh = 90, bw = 28, gap = (W - bw * 7) / 6;
      return `<svg class="mini" viewBox="0 0 ${W} ${Hh + 18}" role="img" aria-label="Tarefas por dia de ${esc(h.name)}">${[0.5, 1].map((f) => `<line x1="0" x2="${W}" y1="${Hh - Hh * f}" y2="${Hh - Hh * f}" stroke="#2c3840" stroke-dasharray="3 4"/>`).join('')}
        ${days.map((d, i) => { const v = (h.log && h.log[d] && h.log[d].t) || 0; const bh = Math.round((v / maxT) * (Hh - 14)); const x = i * (bw + gap); return `<rect x="${x}" y="${Hh - bh}" width="${bw}" height="${Math.max(bh, 2)}" rx="4" fill="${v ? D.CLASSES[h.cls].color : '#2c3840'}"/>${v ? `<text x="${x + bw / 2}" y="${Hh - bh - 4}" text-anchor="middle" font-size="11" fill="#f1e8d4">${v}</text>` : ''}<text x="${x + bw / 2}" y="${Hh + 14}" text-anchor="middle" font-size="10.5" fill="#9eaab0">${D.WEEKDAYS[dowOf(d)]}</text>`; }).join('')}</svg>`; };
    const medalsWeek = (h) => Object.values(h.ach || {}).filter((d) => d >= days[0]).length;
    const reqWeek = (h) => requestList().filter((q) => q.heroId === h.id && q.day >= days[0]);
    const pend = (h) => pendingItems().filter((x) => x.hero.id === h.id).length;
    return `<div class="eyebrow">Relatório dos últimos 7 dias · ${fmtDay(days[0])} a ${fmtDay(t)}</div><h2 style="margin:4px 0 14px">Como a guilda está indo</h2>
      <div class="stats" style="margin-bottom:18px"><div class="stat"><div class="v num">${tot}</div><div class="l">Tarefas da guilda</div></div><div class="stat"><div class="v num">${xpTot}</div><div class="l">XP ganho</div></div><div class="stat"><div class="v num">${(S.party && S.party.history || []).filter((x) => x.day >= days[0] && !x.test && x.win).length}/${(S.party && S.party.history || []).filter((x) => x.day >= days[0] && !x.test).length}</div><div class="l">Vitórias</div></div><div class="stat"><div class="v num">${pendingItems().length + openRequests().length}</div><div class="l">Esperando você</div></div></div>
      <p class="small muted" style="margin:-8px 0 16px">${cmp(tot, totPrev)}.</p>
      <div class="reports">${hs.map((h) => { const tw = sum(h, days, 't'), tp = sum(h, prev, 't'); const rq = reqWeek(h); return `<section class="card rep"><div class="rep-h"><span class="ic">${A.heroSvg(h, { noPet: true, noWeapon: true })}</span><div><h3>${esc(h.name)}</h3><div class="small muted">${D.CLASSES[h.cls].name} · nível ${h.level}</div></div></div>
        ${chart(h)}
        <ul class="rep-l small"><li><b class="num">${tw}</b> tarefas <span class="muted">(${tp ? cmp(tw, tp).split(' em')[0] : 'sem semana anterior'})</span></li><li><b class="num">${sum(h, days, 'x')}</b> XP ganho</li><li>Sequência atual: <b class="num">${streakNow(h)}</b> dia${streakNow(h) === 1 ? '' : 's'} · recorde ${(h.streak && h.streak.best) || 0}</li><li><b class="num">${medalsWeek(h)}</b> medalha${medalsWeek(h) === 1 ? '' : 's'} na semana</li>
        ${rq.length ? `<li>Pedidos: ${rq.map((q) => esc(q.name)).join(', ')}</li>` : ''}${pend(h) ? `<li style="color:#f0d070">${pend(h)} tarefa${pend(h) > 1 ? 's' : ''} esperando aprovação</li>` : ''}</ul></section>`; }).join('')}</div>`;
  }

    if (!S.ready) return;
    const t = today();
    if (t !== lastDay) { lastDay = t; tidyAll(); resolveDay(false); }
    const chip = document.querySelector('.chip.warn b'); if (chip) chip.textContent = countdown();
  }, 30000);

  window.__guildaDebug = { playFx: (ev) => { clearTimeout(replayTimer); playEvent(ev); }, battle: () => S.modal && S.modal.battle, eventFor: (d) => eventFor(d), eventOn: (d) => eventOn(d), isBday: (h, d) => isBday(h, d), contrib: () => { const last = S.party && S.party.last; if (!last) return 'sem batalha'; try { return battleContrib(battleOf(last)); } catch (e) { return 'erro: ' + e.message; } } };
  async function start(snap) {
    render();
    await Store.init();
    await Acct.load();
    S.ready = true;
    const inv = Store.server ? inviteParam() : null;
    if (inv) {
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      if (needAcct()) { S.pendingInvite = inv; sessSet('guilda-invite', inv); S.view = 'rooms'; render(); return; }
      S.invited = inv; await enterRoom(inv); return;
    }
    if (needAcct()) { S.view = 'rooms'; render(); return; }
    const room = (snap && snap.room) || lsGet('guilda-last-room', null);
    if (room) {
      await enterRoom(room);
      if (snap && snap.room === S.room && snap.view && S.me) { S.view = snap.view === 'create' && !snap.draft ? 'home' : snap.view; S.heroId = snap.heroId; S.tab = snap.tab || 'tarefas'; S.draft = snap.draft || null; render(); }
    } else { S.view = 'rooms'; render(); }
  }
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ room: S.room, view: S.view, heroId: S.heroId, tab: S.tab, draft: S.draft }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
